# -------------------------------------
# setup.cfg
# -------------------------------------
# Central configuration file for Python tooling.
# Commonly used for linting, style, and testing settings.
# -------------------------------------

[flake8]
# Maximum allowed line length for code style.
max-line-length = 88

# Ignore specific warnings that conflict with Black formatting.
# E203 and W503 are standard ignores for compatibility.
extend-ignore = E203, W503
